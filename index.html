<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Filamento: dibujas música con luz, a un brazo de distancia. Experiencia VR para Meta Quest 3 con hand tracking." />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Filamento</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <main id="landing">
      <h1>FILAMENTO</h1>
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="line">Coloca luz en la oscuridad. Cuando dos piezas se acercan, la música las une.</p>
      <button id="enter" disabled>Entrar en VR</button>
      <button id="screen">Jugar en pantalla</button>
      <p class="note">Usa auriculares</p>
      <p id="status"></p>
      <section id="song" hidden>
        <canvas id="qr" width="232" height="232" aria-label="Código QR con el enlace a tu tema"></canvas>
        <p class="note">Tu tema vive en este enlace. Escanéalo con el móvil o compártelo.</p>
        <div class="row">
          <button id="copy">Copiar enlace</button>
          <button id="send">Compartir</button>
        </div>
      </section>
    </main>
    <button id="share" hidden>Compartir tema</button>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
